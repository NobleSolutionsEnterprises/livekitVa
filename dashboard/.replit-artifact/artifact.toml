kind = "web"
previewPath = "/"
title = "AI Voice Assistant Dashboard"
version = "1.0.0"
id = "artifacts/va-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 21975
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/va-dashboard run dev"

[services.env]
PORT = "21975"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/va-dashboard", "run", "build"]
publicDir = "artifacts/va-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
