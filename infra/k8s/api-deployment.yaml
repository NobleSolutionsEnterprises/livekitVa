apiVersion: apps/v1
kind: Deployment
metadata:
  name: va-api
  labels:
    app: va-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: va-api
  template:
    metadata:
      labels:
        app: va-api
    spec:
      containers:
        - name: api
          image: va-platform-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: va-platform-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /v1/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: va-api
spec:
  selector:
    app: va-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: va-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: va-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
